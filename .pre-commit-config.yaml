default_language_version:
    python: python3.12
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pycqa/pylint
    rev: v4.0.8
    hooks:
      - id: pylint
        additional_dependencies:
        - aiohttp==3.7.3
        - psutil==7.2.2
        - urllib3==1.26.3
        - tenacity==8.2.3
        exclude: 'tests/'
