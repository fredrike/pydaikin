name: Create new release
on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Part to version-bump'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

env:
  PROJECT: pydaikin

jobs:
  bump_version:
    name: Bump Version
    runs-on: ubuntu-26.04
    outputs:
      version: v${{ steps.version.outputs.current-version }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version-file: 'pyproject.toml' # Read python version from pyproject.toml
    - name: Configure Git
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email '${{ github.actor }}@users.noreply.github.com'

    - name: Bump Version
      id: version
      uses: callowayproject/bump-my-version@master
      env:
        BUMPVERSION_TAG: "true"
      with:
        args: ${{ inputs.part }}
        github-token: ${{ github.token }}
    - name: Check
      if: steps.version.outputs.bumped == 'true'
      run: |
        echo "Version was bumped from ${{ steps.version.outputs.previous-version }} to ${{ steps.version.outputs.current-version }}!"

  build:
    name: Build distribution 📦
    needs:
    - bump_version
    outputs:
      version: ${{ needs.bump_version.outputs.version }}
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.bump_version.outputs.version }}
    - uses: actions/setup-python@v7
      with:
        python-version-file: 'pyproject.toml' # Read python version from a file pyproject.toml
    - name: Install dependencies
      run: |
        pip install build --user
    - name: Build a binary wheel and a source tarball
      run: |
        python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - build
    runs-on: ubuntu-26.04

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release and upload artifacts and signatures
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CURRENT_VERSION: ${{ needs.build.outputs.version }}
      # Create and upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release create
        "$CURRENT_VERSION"
        --repo '${{ github.repository }}'
        --generate-notes
        dist/**

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-26.04

    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PROJECT }}

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
